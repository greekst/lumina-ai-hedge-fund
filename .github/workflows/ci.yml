name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret guard (hard rule 2)
        run: python scripts/check_no_secrets.py --all

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]   # pins need >= 3.12 (see requirements.txt)
    env:
      LUMINA_LLM_MODE: mock          # never call a real LLM in CI
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile & static check
        run: |
          python -m compileall -q app.py core ui tests backtest x_publisher.py
          flake8 app.py core ui backtest tests --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Unit tests (offline, deterministic)
        run: python -m pytest -q
      - name: Legacy hardening suite (zero-cost config; uses network, non-blocking)
        continue-on-error: true
        env:
          LUMINA_SLIPPAGE_BPS: "0"
          LUMINA_COMMISSION_BPS: "0"
          LUMINA_COMMISSION_MIN: "0"
        run: python tests/test_institutional_hardening.py

  ui-smoke:
    runs-on: ubuntu-latest
    env:
      LUMINA_LLM_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Headless dashboard smoke test
        run: LUMINA_UI_SMOKE=1 python -m pytest -q tests/test_ui_smoke.py
